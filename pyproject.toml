[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ccstats"
version = "0.0.0"
description = "Cross-machine Claude Code usage stats: archive, parse, serve"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ccstats = "ccstats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ccstats = ["static/*.html", "remote/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
